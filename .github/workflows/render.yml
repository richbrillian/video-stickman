name: Render video stickman
on:
  push:
    paths: ["cerita/**.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang alat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install pillow numpy edge-tts
      - name: Render cerita baru
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python render.py
      - name: Simpan video
        run: |
          git config user.name "stickman-bot"
          git config user.email "bot@users.noreply.github.com"
          git add video
          git commit -m "Video baru" || exit 0
          git pull --rebase
          git push
